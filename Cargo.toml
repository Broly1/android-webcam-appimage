[package]
name = "scrcpy-webcam-rust"
version = "1.0.4"
authors = ["Broly <jack_sparrow_xv@proton.me>"]
edition = "2021"
description = "Use Android device as a webcam via scrcpy and v4l2loopback (AppImage)"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = "0.7.3"
libc = "0.2"
mdns-sd = "0.21"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.appimage]
# Same release as android-webcam (1.0.4-5); build.rs appends it to the version shown in About.
revision = "5"
